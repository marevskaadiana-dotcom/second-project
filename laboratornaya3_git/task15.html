<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вариант 15</title>
  <style>
    .rainbow {
      height: 50px;
      width: 300px;
      margin-bottom: 5px;
      border: 2px solid white;
      box-sizing: border-box;
    }
    .red     { background-color: red; }
    .orange  { background-color: orange; }
    .yellow  { background-color: yellow; }
    .green   { background-color: green; }
    .cyan    { background-color: #00BFFF; }
    .blue    { background-color: blue; }
    .violet  { background-color: purple; }
  </style>
</head>
<body>

  <div class="rainbow red"></div>
  <div class="rainbow orange"></div>
  <div class="rainbow yellow"></div>
  <div class="rainbow green"></div>
  <div class="rainbow cyan"></div>
  <div class="rainbow blue"></div>
  <div class="rainbow violet"></div>

</body>
</html>
